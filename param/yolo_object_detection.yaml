yolo_object_detection_node:
  ros__parameters:
    model_path: "install/yolo_object_detection/share/yolo_object_detection/model"
    model_file: "yolov8s.onnx"
    processing_frequency: 50.0
    max_processing_queue_size: 3
    # NOTE: input_topic is intentionally NOT set here. It has no safe default
    # since it differs per data source (KITTI bag, CARLA simulator, live
    # sensors, ...). It MUST be remapped via the launch file
    # (e.g. input_topic:=/carla/hero/cam2/image), or the node will
    # refuse to start.
    output_topic: "yolo_object_detection"
